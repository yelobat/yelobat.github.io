[module]
  [module.hugoVersion]
    extended = true
    min      = "0.41.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    anchorLineNos      = false
    codeFences         = false
    guessSyntax        = false
    hl_Lines           = 'inline'
    hl_inline          = true
    lineAnchors        = ''
    lineNoStart        = 1
    lineNos            = true
    lineNumbersInTable = true
    noClasses          = true
    noHl               = true
    style              = ''
    tabWidth           = 4

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[params]
  [params.theme_config]
    appearance        = "auto"
    back_home_text    = "back"
    date_format       = "2006-01-02"
    isListGroupByDate = false
    isShowFooter      = false
